<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="苏浩楷的个人简历：教育经历、专业技能、机器人项目与学术研究。">
  <title>苏浩楷 · 个人简历</title>
  <style>
    :root { color-scheme: light; --ink: #182b43; --accent: #205eb6; --paper: #fff; --back: #eef2f7; --muted: #546477; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--back); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { background: var(--paper); border-top: 4px solid var(--accent); }
    .bar { max-width: 1060px; margin: auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font: 700 24px/1.4 "Songti SC", "SimSun", serif; margin: 0; }
    h1 span { font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--muted); margin-left: 12px; }
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    a { color: var(--accent); text-underline-offset: 4px; }
    nav a { display: inline-flex; min-height: 44px; align-items: center; padding: 9px 16px; border: 1px solid #cbd5e1; border-radius: 6px; text-decoration: none; font-size: 14px; }
    nav .download { background: var(--accent); border-color: var(--accent); color: white; }
    a:hover { filter: brightness(.88); }
    a:focus-visible { outline: 3px solid #cf7c00; outline-offset: 4px; }
    main { max-width: 1060px; margin: 24px auto 40px; padding: 0 24px; }
    .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
    figure { margin: 0 0 24px; }
    .page { display: block; background: white; box-shadow: 0 5px 24px #182b4310; }
    .page img { display: block; width: 100%; height: auto; }
    figcaption { text-align: center; color: var(--muted); font-size: 14px; padding-top: 10px; }
    footer { padding: 0 24px 32px; text-align: center; color: var(--muted); font-size: 14px; }
    @media (max-width: 600px) { .bar { padding: 16px; } main { padding: 0 8px; margin-top: 16px; } .hint { padding: 0 8px; } nav { width: 100%; } nav a { flex: 1; justify-content: center; } }
    @media print { header, .hint, figcaption, footer { display: none; } body { background: white; } main { margin: 0; padding: 0; max-width: none; } figure { margin: 0; break-after: page; } .page { box-shadow: none; } @page { margin: 0; size: A4; } }
  </style>
</head>
<body>
  <header><div class="bar">
    <h1>苏浩楷<span>个人简历</span></h1>
    <nav aria-label="简历文件"><a href="resume.pdf">打开 PDF</a><a class="download" href="resume.pdf" download="苏浩楷-简历.pdf">下载简历</a></nav>
  </div></header>
  <main aria-label="简历预览">
    <p class="hint">点击页面可查看高清原图；项目视频等链接请在 PDF 中打开。</p>
    <figure><a class="page" href="resume-1.png" aria-label="放大简历第 1 页"><img src="resume-1.png" width="1415" height="2000" alt="苏浩楷简历第 1 页：教育经历、专业技能、工作经历和学术论文。完整可选取文字请打开 PDF。"></a><figcaption>1 / 2</figcaption></figure>
    <figure><a class="page" href="resume-2.png" aria-label="放大简历第 2 页"><img src="resume-2.png" width="1415" height="2000" loading="lazy" alt="苏浩楷简历第 2 页：学术论文及竞赛获奖。完整可选取文字请打开 PDF。"></a><figcaption>2 / 2</figcaption></figure>
  </main>
  <footer><a href="mailto:suhkisme@gmail.com">suhkisme@gmail.com</a></footer>
</body>
</html>
